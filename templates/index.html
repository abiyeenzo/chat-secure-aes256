<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Hacker Secure AES256</title>
  <meta name="description" content="Chat sécurisé avec chiffrement AES-256-GCM de bout en bout pour des conversations privées." />
  <meta name="keywords" content="chat, sécurisé, AES-256, chiffrement, privé, conversation" />

  <!-- Inclusion de socket.io -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js" defer></script>
  <!-- Feuille de style -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">

  <div id="login" style="text-align: center;">
    <img src="{{ url_for('static', filename='logo.svg') }}" alt="Logo Chat Hacker AES-256" style="display:block; margin: 0 auto 15px; width:120px; height:auto;" />
    <h1 style="text-align:center;">Chat Hacker AES-256</h1>

    <!-- Formulaire pseudo + phrase secrete du salon -->
<div id="pseudo-form" style="margin-top:20px;">
  <form style="display:flex; flex-direction:column; gap:10px; align-items: center; justify-content: center;">
    <input type="text" id="nickname" placeholder="Ton pseudo" autocomplete="off" style="padding:10px; width:220px; font-size:1em; border-radius:5px; border:1px solid #ccc;" />
    <input type="password" id="passphrase" placeholder="Phrase secrète du salon" autocomplete="off" style="padding:10px; width:220px; font-size:1em; border-radius:5px; border:1px solid #ccc;" />
    <button id="btnLogin" type="button" style="padding:10px 20px; font-size:1em; border:none; border-radius:5px; background-color:#4CAF50; color:white; cursor:pointer;">
      Rejoindre
    </button>
  </form>
  <p style="font-size:0.8em; color:#888; margin-top:10px; max-width:280px;">
    La phrase secrète ne quitte jamais ton navigateur : elle sert uniquement à dériver la clé AES-256. Tous les participants du salon doivent utiliser la même.
  </p>
</div>

    <!-- Zone de chat (initialement masquée) -->
    <div id="chat" style="margin-top:30px; display:none;">
      <div id="messages" style="border:1px solid #ccc; padding:10px; height:300px; overflow-y:auto; background:#f9f9f9; border-radius:5px;"></div>
      <form id="message-form" style="display:flex; margin-top:10px; gap:10px;">
        <input type="text" id="messageInput" placeholder="Tape ton message..." autocomplete="off" style="flex:1; padding:10px; font-size:1em; border-radius:5px; border:1px solid #ccc;" />
        <button id="btnSend" type="button" style="padding:10px 20px; font-size:1em; border:none; border-radius:5px; background-color:#2196F3; color:white; cursor:pointer;">
          Envoyer
        </button>
      </form>
    </div>
  </div>

  <!-- Script JS -->
  <script src="{{ url_for('static', filename='main.js') }}" defer></script>
</body>
</html>
